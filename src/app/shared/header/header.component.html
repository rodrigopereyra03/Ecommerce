<header class="header">
  <div class="logo-container">
    <div class="logo">
      <a routerLink="/">
        <img src="assets/img/logo.png" alt="Logo">
      </a>
    </div>
  </div>
  
    <nav class="nav">
      <a routerLink="/home">Home</a>
      <a routerLink="/about">About</a>
      <a routerLink="/products">Products</a>
      <a routerLink="/details">Details</a>
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>person</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <ng-container *ngIf="isAuthenticated; else notLoggedIn">
          <button mat-menu-item routerLink="/my-account">Mis Datos</button>
          <button mat-menu-item routerLink="/my-orders">Mis Pedidos</button>
          <button mat-menu-item (click)="logout()">Cerrar sesión</button>
        </ng-container>
        
        <ng-template #notLoggedIn>
          <button mat-menu-item routerLink="/login">Iniciar sesión</button>
          <button mat-menu-item routerLink="/register">Registrarse</button>
        </ng-template>
      </mat-menu>
    </nav>
</header>
