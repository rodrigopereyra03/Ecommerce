<div class="register-container">
    <div class="card">
        <h2>Tus Datos</h2>

        <form [formGroup]="registerForm" (ngSubmit)="submit()">
            <!-- Paso 1: Datos Personales -->
            <div *ngIf="step === 1">
                <label>Nombre:</label>
                <input type="text" formControlName="name" required />

                <label>Apellido:</label>
                <input type="text" formControlName="lastName" required />

                <label>DNI:</label>
                <input type="text" formControlName="documentNumber" required />

                <label>Email:</label>
                <input type="email" formControlName="email" required />

                <label>Contraseña:</label>
                <input type="password" formControlName="password" required />

                <label>Confirmar Contraseña:</label>
                <input type="password" formControlName="confirmPassword" required />

                <button type="button" (click)="nextStep()">Siguiente</button>
            </div>

            <!-- Paso 2: Dirección -->
            <div *ngIf="step === 2">
                <label>Calle:</label>
                <input type="text" formControlName="street" required />

                <label>Número:</label>
                <input type="text" formControlName="number" required />

                <label>Código Postal:</label>
                <input type="text" formControlName="zipCode" required />

                <label>Ciudad:</label>
                <input type="text" formControlName="city" required />

                <label>Estado:</label>
                <input type="text" formControlName="state" required />

                <button type="submit">Registrar</button>
            </div>
        </form>

        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </div>
</div>
